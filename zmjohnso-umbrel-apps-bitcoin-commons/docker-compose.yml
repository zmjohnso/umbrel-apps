version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_BITCOIN_COMMONS_NODE_IP
      APP_PORT: 3000

  app:
    image: bitcoin-commons:local
    pull_policy: never
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 15m30s
    # these ports are exposed for external connections to blvm
    ports:
      - "${APP_BITCOIN_COMMONS_P2P_PORT}:${APP_BITCOIN_COMMONS_P2P_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/data # data/app and data/blvm
    environment:
      # BLVM CONF FILE SETTINGS
      APPS_SUBNET: "${NETWORK_IP}/16" # used for rpc allowed IPs
      P2P_PORT: "${APP_BITCOIN_COMMONS_P2P_PORT}"
      P2P_WHITEBIND_PORT: "${APP_BITCOIN_COMMONS_P2P_WHITEBIND_PORT}"
      RPC_PORT: "${APP_BITCOIN_COMMONS_RPC_PORT}"
      TOR_PORT: "${APP_BITCOIN_COMMONS_TOR_PORT}"
      ZMQ_RAWBLOCK_PORT: "${APP_BITCOIN_COMMONS_ZMQ_RAWBLOCK_PORT}"
      ZMQ_RAWTX_PORT: "${APP_BITCOIN_COMMONS_ZMQ_RAWTX_PORT}"
      ZMQ_HASHBLOCK_PORT: "${APP_BITCOIN_COMMONS_ZMQ_HASHBLOCK_PORT}"
      ZMQ_SEQUENCE_PORT: "${APP_BITCOIN_COMMONS_ZMQ_SEQUENCE_PORT}"
      ZMQ_HASHTX_PORT: "${APP_BITCOIN_COMMONS_ZMQ_HASHTX_PORT}"
      TOR_HOST: "${APP_BITCOIN_COMMONS_TOR_PROXY_IP}"
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: "moneyprintergobrrr"
      I2P_HOST: "${APP_BITCOIN_COMMONS_I2P_DAEMON_IP}"
      I2P_SAM_PORT: "7656"

      # RPC CLIENT SETTINGS
      BITCOIND_IP: "${APP_BITCOIN_COMMONS_NODE_IP}"
      RPC_USER: "${APP_BITCOIN_COMMONS_RPC_USER}"
      RPC_PASS: "${APP_BITCOIN_COMMONS_RPC_PASS}"

      # CONNECTION DETAILS (shown to user in the connect modal)
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      P2P_HIDDEN_SERVICE: "${APP_BITCOIN_COMMONS_P2P_HIDDEN_SERVICE}"
      RPC_HIDDEN_SERVICE: "${APP_BITCOIN_COMMONS_RPC_HIDDEN_SERVICE}"
    networks:
      default:
        ipv4_address: $APP_BITCOIN_COMMONS_NODE_IP

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default:
        ipv4_address: "${APP_BITCOIN_COMMONS_TOR_PROXY_IP}"

  i2pd_daemon:
    image: purplei2p/i2pd:release-2.59.0@sha256:257653c18ce0b127ef480e3d8373b3ddbf1495e842674c8cfc59909be0015979
    user: "root"
    command: --sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
    networks:
      default:
        ipv4_address: "${APP_BITCOIN_COMMONS_I2P_DAEMON_IP}"
