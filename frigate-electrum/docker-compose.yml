version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_FRIGATE_ELECTRUM_IP
      APP_PORT: 3006

  app:
    image: getumbrel/umbrel-electrs:v1.0.4@sha256:fa2fd04f4c7515aad84f21640f5feab1417bc18e20bc65cda7ed97e59b8458db
    depends_on:
      - frigate
    restart: on-failure
    environment:
      ELECTRUM_HIDDEN_SERVICE: "${APP_FRIGATE_ELECTRUM_RPC_HIDDEN_SERVICE}"
      ELECTRUM_LOCAL_SERVICE: "${DEVICE_DOMAIN_NAME}"
      ELECTRS_HOST: "${APP_FRIGATE_ELECTRUM_NODE_IP}"
      BITCOIN_HOST: "${APP_BITCOIN_NODE_IP}"
      RPC_USER: "${APP_BITCOIN_RPC_USER}"
      RPC_PASSWORD: "${APP_BITCOIN_RPC_PASS}"
      RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
    networks:
      default:
        ipv4_address: $APP_FRIGATE_ELECTRUM_IP

  frigate:
    image: ghcr.io/sparrowwallet/frigate:1.5.3@sha256:DIGEST_PENDING_FIRST_RELEASE
    restart: always
    environment:
      FRIGATE_BITCOIN_RPC_SERVER: "http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}"
      FRIGATE_BITCOIN_RPC_USER: "${APP_BITCOIN_RPC_USER}"
      FRIGATE_BITCOIN_RPC_PASS: "${APP_BITCOIN_RPC_PASS}"
      FRIGATE_TCP_PORT: "50001"
      FRIGATE_BACKEND_ELECTRUM_SERVER: "${APP_FRIGATE_ELECTRUM_BACKEND_ELECTRUM_SERVER}"
    volumes:
      - "${APP_DATA_DIR}/data/frigate:/data"
    ports:
      - "${APP_FRIGATE_ELECTRUM_NODE_PORT}:50001"
    networks:
      default:
        ipv4_address: $APP_FRIGATE_ELECTRUM_NODE_IP

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
